name: One-time ChronoSFM migration

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/migrate-chronosfm.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Clone source branch
        run: |
          git clone --depth 1 --branch feat/chronosfm-compiler-bootstrap \
            https://github.com/xianyu0514/SFM-Factory-Studio.git /tmp/chronosfm-source

      - name: Replace target snapshot excluding workflows
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          mkdir -p .github
          find .github -mindepth 1 -maxdepth 1 ! -name workflows -exec rm -rf {} +
          tar --exclude=.git --exclude=.github/workflows -C /tmp/chronosfm-source -cf - . | tar -xf -

      - name: Commit migrated snapshot
        run: |
          git config user.name "ChronoSFM Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: migrate ChronoSFM compiler bootstrap from SFM-Factory-Studio" \
            -m "Source: xianyu0514/SFM-Factory-Studio@c8d3a10695f6791ae93715b305df748c0627ef6c" \
            -m "Branch: feat/chronosfm-compiler-bootstrap"
          git push origin HEAD:main
